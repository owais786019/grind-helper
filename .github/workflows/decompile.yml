name: Decompile Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decompile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate Minecraft sources
        run: ./gradlew genSources --stacktrace
      - name: Dump offer logic
        run: |
          echo "===== candidate sources jars ====="
          find / -name '*-sources.jar' 2>/dev/null | head -20
          echo "===== candidate decompiled dirs ====="
          find / -name 'EnchantmentScreenHandler.java' 2>/dev/null | head -5
          rm -rf /tmp/src && mkdir -p /tmp/src
          J=$(find / -name '*-sources.jar' 2>/dev/null | grep -iv 'gradle-\|kotlin' | head -1)
          echo "JAR=$J"
          unzip -o -q "$J" 'net/minecraft/screen/EnchantmentScreenHandler.java' 'net/minecraft/client/gui/screen/ingame/EnchantmentScreen.java' -d /tmp/src
          S=/tmp/src/net/minecraft/screen/EnchantmentScreenHandler.java
          echo "=========== HANDLER ==========="
          grep -n 'enchantmentId\|enchantmentLevel\|enchantmentPower\|RawId\|rawId' "$S"
          echo "=========== CLIENT SCREEN ==========="
          grep -n 'enchantmentId\|enchantmentPower\|enchantmentLevel' /tmp/src/net/minecraft/client/gui/screen/ingame/EnchantmentScreen.java
