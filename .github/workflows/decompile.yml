name: Decompile Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decompile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate Minecraft sources
        run: ./gradlew genSources --stacktrace
      - name: Dump offer logic
        run: |
          echo "===== decompiled javas in gradle home ====="
          find "$GRADLE_USER_HOME" -name 'EnchantmentScreenHandler.java' 2>/dev/null
          echo "===== sources jars in gradle home ====="
          find "$GRADLE_USER_HOME" -name '*sources*.jar' 2>/dev/null
          echo "===== loom-cache ====="
          ls -laR "$GITHUB_WORKSPACE/.gradle" 2>/dev/null | head -40
          echo "===== fabric-loom jars ====="
          find "$GRADLE_USER_HOME/caches/fabric-loom" -type f -name '*.jar' 2>/dev/null
          echo "===== resolve via gradle ====="
          ./gradlew -q dependencies 2>/dev/null | grep -i sources || true
