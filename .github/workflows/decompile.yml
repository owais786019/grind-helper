name: Decompile Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decompile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate Minecraft sources
        run: ./gradlew genSources --stacktrace
      - name: Dump EnchantmentScreenHandler offer logic
        run: |
          F=$(find . -name 'EnchantmentScreenHandler.java' | head -1)
          echo "FOUND: $F"
          echo "===== ids/levels written ====="
          grep -n -B6 -A6 'enchantmentId\[' "$F"
          echo "===== property delegate ====="
          grep -n -B3 -A12 'addProperties\|PropertyDelegate' "$F"
